# ============================================================
#  OptiCRM - bloc nginx (a inclure dans le http { } de nginx.conf)
#  Adapter : "root" (chemin du dist copie) et le port du backend.
# ============================================================
server {
    listen 3200;            # port local servi (cf. tunnel / reverse-proxy)
    server_name _;

    root   C:/opticrm/frontend/dist;   # <-- A ADAPTER : chemin du dist copie
    index  index.html;

    # Taille max requetes (agent Sage : POST /api/v1/sage/push en lots)
    client_max_body_size 50m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json;

    # SPA React Router - pas de cache sur l'index
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        expires 0;
    }

    # Assets statiques caches
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Proxy API -> Spring Boot (port 8082)
    location /api/ {
        proxy_pass         http://localhost:8082/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto https;
        proxy_read_timeout 300s;
        proxy_buffering    off;
    }
}
