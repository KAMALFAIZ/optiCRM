version: '3.8'

# Development-only services (databases only)
# Use this when running backend and frontend locally

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: opticrm-postgres
    environment:
      POSTGRES_DB: opticrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opticrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opticrm-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: opticrm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opticrm-network

  # pgAdmin (optional - for database management)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: opticrm-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@opticrm.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - opticrm-network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  opticrm-network:
    driver: bridge
