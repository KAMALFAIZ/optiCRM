version: '3.8'

# =====================================================
# OptiCRM On-Premise — Installation chez le client
# Usage : docker-compose -f docker-compose.onpremise.yml up -d
# =====================================================

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: opticrm-db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: ${DB_SA_PASSWORD}
      MSSQL_PID: Express
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$SA_PASSWORD" -Q "SELECT 1" -b -No
      interval: 20s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - opticrm-net

  redis:
    image: redis:7-alpine
    container_name: opticrm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: redis-cli -a ${REDIS_PASSWORD} ping
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opticrm-net

  api:
    image: opticrm/crm-api:${OPTICRM_VERSION:-latest}
    container_name: opticrm-api
    restart: unless-stopped
    environment:
      DEPLOYMENT_MODE: onpremise
      DATABASE_URL: "jdbc:sqlserver://sqlserver:1433;databaseName=opticrm;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true"
      DATABASE_USERNAME: sa
      DATABASE_PASSWORD: ${DB_SA_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FLYWAY_ENABLED: "true"
      SPRING_PROFILES_ACTIVE: prod
      SERVER_PORT: 8080
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - uploads_data:/app/uploads
      - ./logs:/app/logs
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - opticrm-net

  web:
    image: opticrm/crm-web:${OPTICRM_VERSION:-latest}
    container_name: opticrm-web
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    environment:
      VITE_API_URL: /api/v1
    volumes:
      - ./nginx.onpremise.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
    networks:
      - opticrm-net

volumes:
  sqlserver_data:
  redis_data:
  uploads_data:

networks:
  opticrm-net:
    driver: bridge
