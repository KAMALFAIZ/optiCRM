spring:
  application:
    name: opticrm-api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DATABASE_URL:jdbc:sqlserver://kasoft.selfip.net;databaseName=opticrm;encrypt=false;trustServerCertificate=true;sendStringParametersAsUnicode=true}
    username: ${DATABASE_USERNAME:sa}
    password: ${DATABASE_PASSWORD:SQL@2019}
    driver-class-name: com.microsoft.sqlserver.jdbc.SQLServerDriver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-init-sql: "SET QUOTED_IDENTIFIER ON; SET ANSI_NULLS ON"

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.SQLServerDialect
        format_sql: true
        default_schema: dbo
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
        # Multi-tenancy discriminator (Hibernate 6): filtre automatique par tenant_id
        multiTenancy: DISCRIMINATOR
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:false}
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 70
    out-of-order: false

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 60000

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    time-zone: Africa/Casablanca

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Upload & App Configuration
app:
  upload:
    dir: ./uploads/avatars

  # Deployment mode: saas | onpremise (default)
  deployment:
    mode: ${DEPLOYMENT_MODE:onpremise}
    root-domain: ${ROOT_DOMAIN:opticrm.ma}
    default-tenant-id: ${DEFAULT_TENANT_ID:00000000-0000-0000-0000-000000000001}
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}

# Anthropic AI Configuration
anthropic:
  api-key: ${ANTHROPIC_API_KEY:your-anthropic-api-key-here}

# ── Module SAV IA Multi-Agent KASOFT ──────────────────────────────────────
sav:
  kamal-whatsapp: ${SAV_KAMAL_WHATSAPP:+212600000000}
  otp-expiration-minutes: ${SAV_OTP_EXPIRATION_MINUTES:10}
  session-expiration-hours: ${SAV_SESSION_EXPIRATION_HOURS:8}
  rapport-quotidien-heure: ${SAV_RAPPORT_QUOTIDIEN_HEURE:19}
  rapport-quotidien-minute: ${SAV_RAPPORT_QUOTIDIEN_MINUTE:0}
  embedding:
    model: ${SAV_EMBEDDING_MODEL:text-embedding-3-small}
    dimension: ${SAV_EMBEDDING_DIMENSION:1536}
    seuil-p1: ${SAV_EMBEDDING_SEUIL_P1:0.80}
    seuil-p2: ${SAV_EMBEDDING_SEUIL_P2:0.75}
    seuil-p3: ${SAV_EMBEDDING_SEUIL_P3:0.70}
  openai:
    api-key: ${OPENAI_API_KEY:}
  claude:
    model: ${SAV_CLAUDE_MODEL:claude-sonnet-4-6}
  whatsapp:
    verify-token: ${WHATSAPP_VERIFY_TOKEN:kasoft-sav-verify-token}

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:YourSuperSecretKeyForJWTTokenSigningMustBeAtLeast256BitsLong}
  access-token-expiration: 28800000  # 8 heures
  refresh-token-expiration: 604800000  # 7 days
  issuer: opticrm

# Server Configuration
server:
  port: ${SERVER_PORT:8081}
  servlet:
    context-path: /
  error:
    include-message: always
    include-binding-errors: always

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

# OpenAPI Configuration
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Logging Configuration
logging:
  level:
    root: INFO
    com.opticrm: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

---
spring:
  config:
    activate:
      on-profile: dev

  jpa:
    show-sql: true

logging:
  level:
    com.opticrm: DEBUG

---
spring:
  config:
    activate:
      on-profile: prod

  jpa:
    show-sql: false

logging:
  level:
    root: WARN
    com.opticrm: INFO
