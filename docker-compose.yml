version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: opticrm-postgres
    environment:
      POSTGRES_DB: opticrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d opticrm"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opticrm-network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: opticrm-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - opticrm-network

  # Backend API (Spring Boot)
  api:
    build:
      context: ./crm-backend
      dockerfile: Dockerfile
    container_name: opticrm-api
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DATABASE_URL: jdbc:postgresql://postgres:5432/opticrm
      DATABASE_USERNAME: postgres
      DATABASE_PASSWORD: postgres
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: YourSuperSecretKeyForJWTTokenSigningMustBeAtLeast256BitsLongForSecurity
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - opticrm-network

  # Frontend Web (React/Vite)
  web:
    build:
      context: ./crm-web
      dockerfile: Dockerfile
    container_name: opticrm-web
    environment:
      VITE_API_URL: http://localhost:8080/api/v1
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - opticrm-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  opticrm-network:
    driver: bridge
